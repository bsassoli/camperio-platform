# Piattaforma Camperio — runtime in container (ADR 0010).
# Produzione: `systemctl start camperio` (unit in systemd/) → compose up -d.
# I segreti vivono in /etc/camperio/camperio.env (root, 600) — mai nel repo.
name: camperio

services:
  comitato:
    build:
      context: ..
      dockerfile: deploy/comitato/Dockerfile
    image: camperio/comitato:latest
    restart: unless-stopped
    env_file:
      - path: /etc/camperio/camperio.env
        required: false      # sul Mac non esiste: si parte in DEMO
    environment:
      COMITATO_AUTH: "1"     # dietro nginx l'utente arriva sempre dagli header
      CAMPERIO_DATA: /var/lib/camperio
    volumes:
      - camperio-data:/var/lib/camperio
    # nessuna porta pubblicata: raggiungibile solo dalla rete compose (nginx)
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    env_file:
      - path: /etc/camperio/camperio.env
        required: false
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"   # espone X-Auth-Request-User/-Groups su /auth
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"          # l'autorizzazione e' per assegnazione utenti su Entra, non per dominio email
      # senza questo, X-Auth-Request-User porta il claim "sub" (id opaco pairwise),
      # non l'email/UPN: l'app si aspetta un utente leggibile (app.py:35, split su "@")
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "true"
      # senza whitelist-domain oauth2-proxy rifiuta QUALUNQUE redirect assoluto (rd=),
      # e nginx lo costruisce sempre assoluto nell'error_page 401 -> loop di warning
      OAUTH2_PROXY_WHITELIST_DOMAINS: "app-ai.camperiosim.com"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - comitato
      - oauth2-proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/camperio/tls:/etc/camperio/tls:ro       # fullchain.pem + privkey.pem (AD CS)
      - camperio-data:/var/lib/camperio:ro           # per servire output/ statico
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  camperio-data:

# Subnet FISSA per la rete dello stack. Senza, Docker pesca la prima libera dal suo
# pool (172.17-172.31.x.x) e in Camperio ha preso 172.18.0.0/16, che e' la rete dei
# PC aziendali: la VM instradava le risposte ai client nel bridge Docker e spariva
# dalla rete a ogni avvio. Il /24 basta per tre container; se la subnet va cambiata,
# prima `docker compose down` (la rete va ricreata, non si aggiorna in place).
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.238.0/24

# Perimetro della piattaforma (spec §2): TLS, autenticazione, header riscritti.
worker_processes auto;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  # log unico degli accessi con l'utente autenticato (spec §2)
  log_format campo '$remote_addr - $auth_user [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout campo;

  client_max_body_size 32m;
  ssl_protocols TLSv1.2 TLSv1.3;

  server {
    listen 443 ssl;
    server_name app-ai.camperiosim.com;

    ssl_certificate     /etc/camperio/tls/fullchain.pem;   # CA interna AD CS
    ssl_certificate_key /etc/camperio/tls/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- oauth2-proxy ---
    location /oauth2/ {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Uri $request_uri;
      # i token Entra con claim groups superano i buffer di default
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;
    }
    location = /oauth2/auth {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
      # i token Entra con claim groups superano i buffer di default
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;
    }

    # --- output/ statico dei job (spec §2: file scritti dai job, serviti da nginx) ---
    location /output/ {
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

      # anche qui SOLO da auth_request: serve a registrare l'utente nel log
      # di audit anche sui download statici (per questo il log esiste)
      auth_request_set $auth_user   $upstream_http_x_auth_request_user;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

      alias /var/lib/camperio/output/;
    }

    # --- app Comitato: per ora sulla radice (portale per path con la seconda app) ---
    location / {
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

      # gli header di identita' vengono SOLO da auth_request: qualunque valore
      # in ingresso viene sovrascritto qui (obbligo del contratto, spec §2)
      auth_request_set $auth_user   $upstream_http_x_auth_request_user;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
      proxy_set_header X-Auth-Request-User   $auth_user;
      proxy_set_header X-Auth-Request-Groups $auth_groups;
      proxy_set_header X-Remote-User "";
      proxy_set_header X-Forwarded-User "";

      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header X-Forwarded-Proto $scheme;

      # l'IP del container comitato cambia a ogni ricreazione: risolvi a runtime
      # invece di fissarlo all'avvio di nginx (DNS non stantio dopo i rebuild)
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $comitato http://comitato:5001;
      proxy_pass $comitato;
      proxy_set_header Host $host;
    }
  }
}

# Perimetro della piattaforma (spec §2): TLS, autenticazione, header riscritti.
worker_processes auto;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  # log unico degli accessi con l'utente autenticato (spec §2)
  log_format campo '$remote_addr - $auth_user [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout campo;

  server {
    listen 443 ssl;
    server_name app-ai.camperiosim.com;

    ssl_certificate     /etc/camperio/tls/fullchain.pem;   # CA interna AD CS
    ssl_certificate_key /etc/camperio/tls/privkey.pem;

    # --- oauth2-proxy ---
    location /oauth2/ {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Uri $request_uri;
    }
    location = /oauth2/auth {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
    }

    # --- output/ statico dei job (spec §2: file scritti dai job, serviti da nginx) ---
    location /output/ {
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;
      alias /var/lib/camperio/output/;
    }

    # --- app Comitato: per ora sulla radice (portale per path con la seconda app) ---
    location / {
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

      # gli header di identita' vengono SOLO da auth_request: qualunque valore
      # in ingresso viene sovrascritto qui (obbligo del contratto, spec §2)
      auth_request_set $auth_user   $upstream_http_x_auth_request_user;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
      proxy_set_header X-Auth-Request-User   $auth_user;
      proxy_set_header X-Auth-Request-Groups $auth_groups;
      proxy_set_header X-Remote-User "";
      proxy_set_header X-Forwarded-User "";

      proxy_pass http://comitato:5001;
      proxy_set_header Host $host;
    }
  }
}

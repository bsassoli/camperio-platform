[project]
name = "camperio-platform"
version = "0.1.0"
description = "Piattaforma Camperio: core condiviso, jobs schedulati, app interattive, agente"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = ["pytest"]
comitato = ["Flask>=3.0", "python-docx>=1.1", "openpyxl>=3.1", "reportlab>=4.0", "matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["core", "apps/comitato"]
testpaths = ["core/tests", "apps/comitato/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]
